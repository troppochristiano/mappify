<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="The macOS alert reading Mappify Not Opened, with Move to Trash and Done. Done is the one to click.">
  <rect width="880" height="400" rx="14" fill="#eef1f5"/>

  <!-- alert -->
  <rect x="262" y="34" width="356" height="332" rx="16" fill="#f5f5f7" stroke="#dcdfe4"/>
  <!-- warning app icon -->
  <g transform="translate(400,58)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#0b1a2b"/>
    <circle cx="40" cy="40" r="26" fill="none" stroke="#5ad1ff" stroke-width="2.5"/>
    <ellipse cx="40" cy="40" rx="12" ry="26" fill="none" stroke="#5ad1ff" stroke-width="2"/>
    <path d="M15 31h50M15 49h50" stroke="#5ad1ff" stroke-width="2"/>
    <circle cx="66" cy="66" r="17" fill="#f5f5f7"/>
    <circle cx="66" cy="66" r="14" fill="#ffcc00"/>
    <path d="M66 57v11" stroke="#3d2c00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="66" cy="73.5" r="1.9" fill="#3d2c00"/>
  </g>

  <text x="440" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">“Mappify” Not Opened</text>
  <text x="440" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3c3c43">Apple could not verify “Mappify” is free of</text>
  <text x="440" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3c3c43">malware that may harm your Mac or</text>
  <text x="440" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3c3c43">compromise your privacy.</text>

  <rect x="290" y="256" width="300" height="34" rx="9" fill="#ffffff" stroke="#d2d5da"/>
  <text x="440" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1d1d1f">Move to Trash</text>

  <rect x="290" y="300" width="300" height="34" rx="9" fill="#0071e3"/>
  <text x="440" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff">Done</text>

  <!-- annotations -->
  <path d="M188 276 H 282" stroke="#8e8e93" stroke-width="2" fill="none"/>
  <path d="M282 276 l-12 -6 v12 z" fill="#8e8e93"/>
  <text x="180" y="272" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6e6e73">not this one</text>

  <path d="M690 317 H 598" stroke="#e8590c" stroke-width="3" fill="none"/>
  <path d="M598 317 l12 -6 v12 z" fill="#e8590c"/>
  <text x="700" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8590c">click Done</text>
  <text x="700" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e73">nothing is deleted</text>
</svg>

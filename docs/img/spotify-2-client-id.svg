<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="The Spotify app settings page showing the Client ID to copy, and the client secret which is not needed.">
  <rect width="880" height="400" rx="14" fill="#0a0a0a"/>
  <rect x="30" y="26" width="820" height="348" rx="12" fill="#121212" stroke="#2a2a2a"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="70" font-size="22" font-weight="700" fill="#ffffff">Mappify</text>
    <text x="60" y="94" font-size="12.5" fill="#7a7a7a">Basic information</text>

    <rect x="700" y="52" width="120" height="34" rx="17" fill="#282828"/>
    <text x="760" y="74" text-anchor="middle" font-size="13" fill="#ffffff">Settings</text>

    <text x="60" y="146" font-size="12.5" fill="#b3b3b3">Client ID</text>
    <rect x="58" y="156" width="452" height="40" rx="7" fill="#181818" stroke="#1db954" stroke-width="2"/>
    <text x="76" y="181" font-size="14" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4f9a2c7e81b34d6f9c0e5a1b7d82f3a6</text>

    <text x="60" y="240" font-size="12.5" fill="#b3b3b3">Client secret</text>
    <text x="60" y="266" font-size="13.5" fill="#7a7a7a" text-decoration="underline">View client secret</text>
  </g>

  <path d="M660 176 H 528" stroke="#ff8a3d" stroke-width="3" fill="none"/>
  <path d="M528 176 l12 -6 v12 z" fill="#ff8a3d"/>
  <text x="672" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ff8a3d">copy this</text>
  <text x="672" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a7a7a">32 letters and digits</text>

  <path d="M320 258 H 216" stroke="#5a5a5a" stroke-width="2" fill="none"/>
  <path d="M216 258 l12 -6 v12 z" fill="#5a5a5a"/>
  <text x="332" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a7a7a">not needed — Mappify never asks for the secret</text>
</svg>

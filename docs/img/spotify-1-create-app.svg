<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="The Spotify Create app form, with the redirect URI field and the Web API checkbox highlighted.">
  <rect width="880" height="520" rx="14" fill="#0a0a0a"/>
  <rect x="30" y="26" width="820" height="468" rx="12" fill="#121212" stroke="#2a2a2a"/>

  <text x="60" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Create app</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="112" font-size="12.5" fill="#b3b3b3">App name</text>
    <rect x="60" y="122" width="480" height="36" rx="6" fill="#181818" stroke="#3a3a3a"/>
    <text x="76" y="145" font-size="13.5" fill="#ffffff">Mappify</text>

    <text x="60" y="184" font-size="12.5" fill="#b3b3b3">App description</text>
    <rect x="60" y="194" width="480" height="36" rx="6" fill="#181818" stroke="#3a3a3a"/>
    <text x="76" y="217" font-size="13.5" fill="#ffffff">My own copy</text>

    <text x="60" y="256" font-size="12.5" fill="#b3b3b3">Redirect URI</text>
    <rect x="58" y="264" width="484" height="40" rx="7" fill="#181818" stroke="#1db954" stroke-width="2"/>
    <text x="76" y="289" font-size="13.5" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">http://127.0.0.1:6942/api/auth/callback</text>
    <rect x="556" y="266" width="66" height="36" rx="18" fill="#282828"/>
    <text x="589" y="289" text-anchor="middle" font-size="13" fill="#ffffff">Add</text>

    <text x="60" y="348" font-size="12.5" fill="#b3b3b3">Which API/SDKs are you planning to use?</text>
    <rect x="60" y="362" width="18" height="18" rx="4" fill="#1db954"/>
    <path d="M64 371 l4 4 l7 -8" stroke="#000000" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="376" font-size="13.5" fill="#ffffff" font-weight="600">Web API</text>
    <rect x="196" y="362" width="18" height="18" rx="4" fill="none" stroke="#5a5a5a" stroke-width="1.6"/>
    <text x="224" y="376" font-size="13.5" fill="#7a7a7a">Web Playback SDK</text>
    <rect x="392" y="362" width="18" height="18" rx="4" fill="none" stroke="#5a5a5a" stroke-width="1.6"/>
    <text x="420" y="376" font-size="13.5" fill="#7a7a7a">iOS</text>

    <rect x="60" y="410" width="18" height="18" rx="4" fill="#1db954"/>
    <path d="M64 419 l4 4 l7 -8" stroke="#000000" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="424" font-size="12.5" fill="#b3b3b3">I understand and agree with the Spotify Developer Terms of Service</text>

    <rect x="440" y="440" width="100" height="38" rx="19" fill="#1db954"/>
    <text x="490" y="464" text-anchor="middle" font-size="13.5" font-weight="700" fill="#000000">Save</text>
  </g>

  <path d="M708 246 C 640 246, 610 266, 552 282" stroke="#ff8a3d" stroke-width="3" fill="none"/>
  <path d="M552 282 l14 -2 l-7 -10 z" fill="#ff8a3d"/>
  <text x="716" y="216" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ff8a3d">paste this from Mappify — exactly</text>
  <text x="716" y="236" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a7a7a">then press Add</text>

  <rect x="50" y="354" width="122" height="32" rx="8" fill="none" stroke="#ff8a3d" stroke-width="2"/>
  <text x="560" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ff8a3d">Web API is the only one you need</text>
</svg>

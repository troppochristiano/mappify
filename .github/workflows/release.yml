# Builds a download-and-double-click bundle for each platform.
#
# Each zip contains the app, its dependencies, the built web front end, and a
# copy of the Node runtime — so someone who has never heard of npm unzips it,
# double-clicks Mappify, and has a globe. Nothing to install.
#
# Why one runner per platform rather than three zips from one: the dependency
# tree can resolve platform-specific optional packages, and npm only picks the
# right ones on the platform it is installing for. Building all three on Linux
# produces two bundles that fail on first launch.
#
# Trigger with a tag:  git tag v0.1.0 && git push --tags
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            node: node-v24.14.0-win-x64
            ext: zip
          - os: macos-latest
            name: macos-arm64
            node: node-v24.14.0-darwin-arm64
            ext: tar.gz
          - os: ubuntu-latest
            name: linux-x64
            node: node-v24.14.0-linux-x64
            ext: tar.xz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build
        run: |
          npm install --omit=dev
          npm run build

      - name: Fetch the Node runtime to ship
        shell: bash
        run: |
          curl -fsSLO "https://nodejs.org/dist/v24.14.0/${{ matrix.node }}.${{ matrix.ext }}"
          mkdir -p runtime
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            # 7z, not unzip: the bash on a Windows runner is Git Bash, which does
            # not ship unzip. 7z is on the image and is what the packaging step
            # below already uses.
            7z x -y "${{ matrix.node }}.zip" >/dev/null
            # Windows keeps node.exe at the top of the archive, not in bin/.
            cp "${{ matrix.node }}/node.exe" runtime/
          else
            tar -xf "${{ matrix.node }}.${{ matrix.ext }}"
            mkdir -p runtime/bin
            cp "${{ matrix.node }}/bin/node" runtime/bin/
          fi

      # The 63 MB origin index, kept as a release asset rather than in git: it is
      # rebuilt whenever the MusicBrainz dump is, and every rebuild committed
      # would be another 35 MB blob in the history for ever.
      #
      # Publish one with:
      #   node tools/build-bundle-index.js
      #   gzip -9 -k data/index.db
      #   gh release upload index data/index.db.gz --clobber
      #
      # A build without it still works — imports fall back to MusicBrainz at one
      # request per second — so this warns rather than failing.
      - name: Fetch the origin index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download index --pattern index.db.gz --output index.db.gz 2>/dev/null; then
            gzip -d index.db.gz
            printf 'index: %s MB\n' "$(du -m index.db | cut -f1)"
          else
            echo "::warning::No 'index' release asset found — this build will resolve"
            echo "::warning::origins against MusicBrainz at 1 req/s instead of instantly."
          fi

      # Windows gets a real executable rather than a .bat: a .bat carrying Mark
      # of the Web — which everything extracted from a downloaded zip carries —
      # is refused outright, usually with nothing to click. The launcher is also
      # a windows-subsystem binary, so there is no console window at all.
      - name: Build the launcher
        if: matrix.os == 'windows-latest'
        run: cargo build --release --manifest-path launcher/Cargo.toml

      - name: Assemble
        shell: bash
        run: |
          mkdir -p out/Mappify
          cp -r server tools web/dist runtime package.json README.md out/Mappify/
          mkdir -p out/Mappify/web && mv out/Mappify/dist out/Mappify/web/dist
          [ -d node_modules ] && cp -r node_modules out/Mappify/ || true
          [ -f index.db ] && cp index.db out/Mappify/ || true
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp launcher/target/release/Mappify.exe out/Mappify/
          else
            cp Mappify.command out/Mappify/
            chmod +x out/Mappify/Mappify.command
          fi

      - name: Package
        shell: bash
        run: |
          cd out
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a -tzip "../mappify-${{ matrix.name }}.zip" Mappify >/dev/null
          else
            zip -qr "../mappify-${{ matrix.name }}.zip" Mappify
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mappify-${{ matrix.name }}
          path: mappify-${{ matrix.name }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mappify-${{ matrix.name }}.zip
          body: |
            Download the file for your computer, unzip it, and open **Mappify**.

            Nothing to install — the runtime and the origin index are both inside,
            so your library is placed on the map in seconds and Spotify is the only
            thing it talks to.

            The index is a snapshot of MusicBrainz. An artist added to MusicBrainz
            after this was built is looked up live instead, which is slower but
            still works.

            ### Windows

            Unzip and double-click **Mappify.exe**. Windows will object, in one
            of two ways.

            **"Windows protected your PC"** (blue box) is SmartScreen: click
            **More info** → **Run anyway**. Once, not every time.

            **"Smart App Control has blocked an app that might be unsafe"** is a
            different and stricter check, and it offers no way through — there is
            only **OK**. It is on by default on some recent Windows 11 machines
            and blocks anything unsigned regardless of where it came from, so
            there is nothing to unblock and nothing to click. Two ways round it:

            - **Start it without the launcher.** In the Mappify folder, open a
              terminal and run `runtime\node.exe tools\start.js`. That is exactly
              what double-clicking does; the copy of Node in the folder is signed,
              so it is allowed through. Leave the terminal open while you use it.
            - **Turn Smart App Control off**, under Windows Security → App &
              browser control. Be careful with this one: Microsoft says it cannot
              be turned back on afterwards without reinstalling Windows.

            No console window appears when the launcher works. Mappify keeps
            running after you close the browser tab — there is a **Quit Mappify**
            button in the library panel.

            If it seems to do nothing at all, look in
            `%APPDATA%\Mappify\launcher.log`. The usual answer is that Mappify was
            already running: it will not start a second copy, and reopens the one
            you have instead.

            ### macOS

            Right-click **Mappify.command** → **Open**, then **Open** again. Once,
            not every time.

            Neither system trusts this because the download is not code-signed —
            a certificate costs a few hundred a year, and this is a personal
            project.

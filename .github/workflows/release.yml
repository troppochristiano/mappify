# Builds a download-and-double-click bundle for each platform.
#
# Each zip contains the app, its dependencies, the built web front end, and a
# copy of the Node runtime — so someone who has never heard of npm unzips it,
# double-clicks Mappify, and has a globe. Nothing to install.
#
# Why one runner per platform rather than three zips from one: the dependency
# tree can resolve platform-specific optional packages, and npm only picks the
# right ones on the platform it is installing for. Building all three on Linux
# produces two bundles that fail on first launch.
#
# Trigger with a tag:  git tag v0.1.0 && git push --tags
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            node: node-v24.14.0-win-x64
            ext: zip
          - os: macos-latest
            name: macos-arm64
            node: node-v24.14.0-darwin-arm64
            ext: tar.gz
          - os: ubuntu-latest
            name: linux-x64
            node: node-v24.14.0-linux-x64
            ext: tar.xz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build
        run: |
          npm install --omit=dev
          npm run build

      - name: Fetch the Node runtime to ship
        shell: bash
        run: |
          curl -fsSLO "https://nodejs.org/dist/v24.14.0/${{ matrix.node }}.${{ matrix.ext }}"
          mkdir -p runtime
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            # 7z, not unzip: the bash on a Windows runner is Git Bash, which does
            # not ship unzip. 7z is on the image and is what the packaging step
            # below already uses.
            7z x -y "${{ matrix.node }}.zip" >/dev/null
            # Windows keeps node.exe at the top of the archive, not in bin/.
            cp "${{ matrix.node }}/node.exe" runtime/
          else
            tar -xf "${{ matrix.node }}.${{ matrix.ext }}"
            mkdir -p runtime/bin
            cp "${{ matrix.node }}/bin/node" runtime/bin/
          fi

      # The 63 MB origin index, kept as a release asset rather than in git: it is
      # rebuilt whenever the MusicBrainz dump is, and every rebuild committed
      # would be another 35 MB blob in the history for ever.
      #
      # Publish one with:
      #   node tools/build-bundle-index.js
      #   gzip -9 -k data/index.db
      #   gh release upload index data/index.db.gz --clobber
      #
      # A build without it still works — imports fall back to MusicBrainz at one
      # request per second — so this warns rather than failing.
      - name: Fetch the origin index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download index --pattern index.db.gz --output index.db.gz 2>/dev/null; then
            gzip -d index.db.gz
            printf 'index: %s MB\n' "$(du -m index.db | cut -f1)"
          else
            echo "::warning::No 'index' release asset found — this build will resolve"
            echo "::warning::origins against MusicBrainz at 1 req/s instead of instantly."
          fi

      - name: Assemble
        shell: bash
        run: |
          # macOS ships an .app, which is a folder the Finder treats as one
          # object — so everything must live *inside* it, or dragging it to
          # Applications leaves the payload behind and the app opens once.
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            APP=out/Mappify.app
            PAYLOAD=$APP/Contents/Resources/app
          else
            APP=out/Mappify
            PAYLOAD=$APP
          fi
          mkdir -p "$PAYLOAD"
          cp -r server tools web/dist runtime package.json README.md "$PAYLOAD/"
          mkdir -p "$PAYLOAD/web" && mv "$PAYLOAD/dist" "$PAYLOAD/web/dist"
          [ -d node_modules ] && cp -r node_modules "$PAYLOAD/" || true
          [ -f index.db ] && cp index.db "$PAYLOAD/" || true
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cp -r mac/Mappify.app/Contents/MacOS "$APP/Contents/MacOS"
            # The exec bit does not reliably survive a checkout, and a bundle
            # whose executable is not executable fails with "the application can
            # not be opened" and no reason given.
            chmod +x "$APP/Contents/MacOS/Mappify"
            mkdir -p "$APP/Contents/Resources"
            cp assets/Mappify.icns "$APP/Contents/Resources/Mappify.icns"
            VERSION=$(node -p "require('./package.json').version")
            sed "s/__VERSION__/$VERSION/g" mac/Mappify.app/Contents/Info.plist > "$APP/Contents/Info.plist"
          fi
          # Linux keeps the script-and-desktop-entry pair: .command is what the
          # entry's Exec line runs, and a file manager will not offer to run an
          # entry that is not executable.
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cp Mappify.command Mappify.desktop out/Mappify/
            chmod +x out/Mappify/Mappify.command out/Mappify/Mappify.desktop
            cp web/public/icon-512.png out/Mappify/Mappify.png
          fi

      # A shortcut to the Node we ship, rather than a launcher of our own.
      #
      # The launcher this replaces was a small unsigned Rust binary that started a
      # hidden child process — which is also the shape of a dropper, so Defender's
      # ML model began blocking it outright as Wacatac!ml, severity 5, with no
      # "run anyway" offered. There is nothing to appeal in a build with no binary
      # of ours in it: node.exe is signed by the OpenJS Foundation, and a shortcut
      # is inert.
      #
      # The cost is a console window, minimised (ShowCmd 7) rather than absent.
      # Closing it stops the server, which is what the job object used to do.
      - name: Make the Windows shortcut
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item web/public/favicon.ico out/Mappify/Mappify.ico
          ./tools/make-shortcut.ps1 `
            -Lnk       out/Mappify/Mappify.lnk `
            -Target    out/Mappify/runtime/node.exe `
            -Arguments 'tools\start.js' `
            -WorkDir   out/Mappify `
            -Icon      out/Mappify/Mappify.ico `
            -Description 'Mappify — a globe of your music' `
            -ShowCmd   7

      - name: Package
        shell: bash
        run: |
          cd out
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a -tzip "../mappify-${{ matrix.name }}.zip" Mappify >/dev/null
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # The bundle at the top of the zip, so unzipping gives an app to drag
            # rather than a folder to open first. -y keeps symlinks as symlinks.
            zip -qry "../mappify-${{ matrix.name }}.zip" Mappify.app
          else
            zip -qr "../mappify-${{ matrix.name }}.zip" Mappify
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mappify-${{ matrix.name }}
          path: mappify-${{ matrix.name }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mappify-${{ matrix.name }}.zip
          body: |
            Download the file for your computer, unzip it, and open **Mappify**.

            Nothing to install — the runtime and the origin index are both inside,
            so your library is placed on the map in seconds and Spotify is the only
            thing it talks to.

            The index is a snapshot of MusicBrainz. An artist added to MusicBrainz
            after this was built is looked up live instead, which is slower but
            still works.

            ### Windows

            Unzip the whole folder somewhere and double-click **Mappify**. A small
            terminal window opens minimised and the app comes up in your browser.

            Keep the folder together — the shortcut points at the copy of Node
            beside it — and leave the terminal window alone while you are using
            the app. Closing it stops the server; the browser tab on its own can
            be closed and reopened freely, and there is a **Quit Mappify** button
            in the library panel.

            Earlier versions shipped a small launcher of our own, which Microsoft
            Defender started blocking as a false positive. This one ships no
            executable of ours at all: the shortcut runs the copy of Node in the
            folder, which is signed by the OpenJS Foundation, so nothing objects.

            If double-clicking seems to do nothing, open the folder in a terminal
            and run `runtime\node.exe tools\start.js` — the same thing the
            shortcut does, with the error left on screen. The usual answer is that
            Mappify is already running: it will not start a second copy.

            ### macOS

            Right-click **Mappify.command** → **Open**, then **Open** again. Once,
            not every time.

            macOS does not trust this because the download is not code-signed — a
            certificate costs a few hundred a year, and this is a personal
            project.

            ### Linux

            Double-click **Mappify.desktop**. Most desktops will not run a
            downloaded entry until you say so: in the file's Properties, tick
            **Allow executing file as program** (GNOME also has **Allow
            Launching** in its right-click menu), then open it.

            Or skip all that and run `./Mappify.command` from a terminal in the
            folder — it is the same script the entry starts, and it prints
            anything that goes wrong.

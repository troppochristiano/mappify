<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores both the SVG icon and the manifest when someone adds the
         app to their home screen, and falls back to a screenshot of the page if
         this is missing. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes the window an application rather than a page: its own name and
         icon in the taskbar, and an "Install" option for a Start-menu entry. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <!-- The whole planet in one 40kB tile. MapLibre draws the deepest tile it
         has, so this one is a complete Earth on the first frame and stays
         underneath as the detail streams in on top of it. Fetched in parallel
         with the bundle rather than after it. -->
    <link rel="preload" as="image" href="/earth/0/0/0.jpg" />

    <!-- The player is the Spotify embed, and everything it needs is
         cross-origin: this API script, the chunk it pulls from the CDN, then
         the embed document itself. Just these two origins — measured, not
         guessed; every extra preconnect is a socket held open for nothing. -->
    <link rel="preconnect" href="https://open.spotify.com" />
    <link rel="preconnect" href="https://embed-cdn.spotifycdn.com" crossorigin />
    <!-- Loaded here rather than injected when the player mounts, because the
         player mounts behind /api/setup and a React render — the fetch used to
         start only once the app was already on screen, costing a second before
         anything could play. The API calls this global exactly once, ever, so
         it is captured into a promise now, while the parser is still here and
         the async script below cannot yet have run. SpotifyPlayer awaits that
         promise instead of racing to install a second callback. -->
    <script>
      window.__spotifyIframeApi = new Promise((resolve) => {
        window.onSpotifyIframeApiReady = resolve
      })
    </script>
    <script async src="https://open.spotify.com/embed/iframe-api/v1"></script>
    <title>Mappify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
